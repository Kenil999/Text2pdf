<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Text2PDF</title>
  <style>
    :root {
      --bg-shell: #0f141b;
      --bg-panel: #151c25;
      --bg-panel-elevated: #1b2430;
      --text-ui: #d6dde7;
      --text-muted: #97a3b6;
      --border-ui: #2b3646;
      --accent-ui: #5ca4c7;
      --accent-ui-strong: #75b8d6;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.35);

      --doc-bg: #f7f3ea;
      --doc-text: #2f353f;
      --doc-accent: #355b6d;
      --doc-rule: #b5bcc3;
      --doc-code-bg: #eee7da;
      --doc-quote-bg: #f3ede1;

      --doc-font-size: 16px;
      --doc-line-height: 1.65;
      --doc-measure: 68ch;
      --page-width: 210mm;
      --page-height: 297mm;
      --page-padding: 20mm;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at 25% 10%, #1a2230 0%, #0f141b 60%, #0a0d12 100%);
      color: var(--text-ui);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(320px, 420px) 1fr;
      min-height: 100vh;
      gap: 20px;
      padding: 18px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(27, 36, 48, 0.95), rgba(20, 27, 37, 0.95));
      border: 1px solid var(--border-ui);
      border-radius: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 20px 20px 12px;
      border-bottom: 1px solid var(--border-ui);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand h1 {
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.01em;
      font-size: 1.2rem;
    }

    .brand p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .live-indicator {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .live-indicator::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #58c98a;
      box-shadow: 0 0 0 0 rgba(88, 201, 138, 0.6);
      animation: pulse 2.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(88, 201, 138, 0.6); }
      70% { box-shadow: 0 0 0 8px rgba(88, 201, 138, 0); }
      100% { box-shadow: 0 0 0 0 rgba(88, 201, 138, 0); }
    }

    .controls {
      padding: 16px 20px 20px;
      overflow: auto;
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .group {
      border: 1px solid var(--border-ui);
      border-radius: 14px;
      background: rgba(15, 20, 27, 0.45);
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .group-title {
      margin: 0;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-size: 0.86rem;
      color: var(--text-ui);
      font-weight: 600;
    }

    .field input, .field select, textarea {
      width: 100%;
      font: inherit;
      color: #e6ecf5;
      border: 1px solid #324054;
      border-radius: 10px;
      padding: 10px 12px;
      background: #10161f;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.08s ease;
    }

    .field input:focus, .field select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-ui);
      box-shadow: 0 0 0 3px rgba(92, 164, 199, 0.2);
    }

    textarea {
      min-height: 280px;
      line-height: 1.5;
      resize: vertical;
      font-family: "IBM Plex Sans", Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .export-btn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px 16px;
      font-weight: 700;
      font-size: 1rem;
      color: #08111a;
      background: linear-gradient(135deg, #81d2f3, #5ca4c7 55%, #4d8aa8);
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.18s ease, filter 0.18s ease;
      box-shadow: 0 12px 22px rgba(44, 109, 137, 0.35);
    }

    .export-btn:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
      box-shadow: 0 16px 24px rgba(44, 109, 137, 0.45);
    }

    .export-btn:active { transform: translateY(1px) scale(0.995); }

    .preview-shell {
      display: grid;
      align-items: start;
      justify-items: center;
      padding: 12px 6px 12px 0;
      overflow: auto;
    }

    .page {
      width: min(100%, calc(var(--page-width) + 40px));
      padding: 20px;
      transition: all 220ms ease;
    }

    .paper {
      width: var(--page-width);
      min-height: var(--page-height);
      margin: 0 auto;
      background: var(--doc-bg);
      color: var(--doc-text);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.42);
      border-radius: 4px;
      padding: var(--page-padding);
      border: 1px solid rgba(53, 91, 109, 0.15);
      transition: transform 0.22s ease;
    }

    .title-block {
      text-align: center;
      margin-bottom: 1.6rem;
    }

    .title-block h1 {
      margin: 0;
      color: var(--doc-accent);
      font-size: 2rem;
      line-height: 1.2;
      letter-spacing: 0.01em;
      font-weight: 600;
    }

    .subject-tag {
      margin-top: 0.45rem;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #5f7280;
      font-variant: small-caps;
    }

    .title-rule {
      margin: 0.95rem auto 0;
      border: 0;
      border-top: 1px solid var(--doc-rule);
      max-width: 280px;
    }

    .doc {
      max-width: var(--doc-measure);
      margin: 0 auto;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
      font-size: var(--doc-font-size);
      line-height: var(--doc-line-height);
      text-wrap: pretty;
    }

    .doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 {
      color: var(--doc-accent);
      margin: 1.35em 0 0.55em;
      line-height: 1.26;
      font-weight: 700;
      break-after: avoid;
      page-break-after: avoid;
    }
    .doc h1 { font-size: 1.7em; }
    .doc h2 { font-size: 1.45em; }
    .doc h3 { font-size: 1.26em; }
    .doc h4 { font-size: 1.12em; }
    .doc h5 { font-size: 1.03em; }
    .doc h6 { font-size: 0.96em; text-transform: uppercase; letter-spacing: 0.04em; }

    .doc p { margin: 0 0 0.86em; }
    .doc a { color: #2f627a; text-decoration-thickness: 1px; text-underline-offset: 2px; }
    .doc strong { font-weight: 700; }
    .doc em { font-style: italic; }

    .doc hr {
      border: 0;
      border-top: 1px solid var(--doc-rule);
      margin: 1.2em 0;
    }

    .doc ul, .doc ol {
      margin: 0.5em 0 0.95em;
      padding-left: 1.55em;
    }

    .doc li { margin: 0.3em 0; }

    .doc blockquote {
      margin: 0.95em 0;
      padding: 0.6em 0.95em;
      background: var(--doc-quote-bg);
      border-left: 3px solid #6a8898;
      color: #394754;
    }

    .doc pre {
      background: var(--doc-code-bg);
      border: 1px solid #d5cebe;
      border-radius: 4px;
      padding: 0.85em 1em;
      overflow-x: auto;
      line-height: 1.45;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.9em;
      white-space: pre;
      margin: 0.95em 0;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .doc code {
      background: rgba(53, 91, 109, 0.11);
      padding: 0.08em 0.3em;
      border-radius: 4px;
      font-size: 0.9em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .doc pre code { background: none; padding: 0; }

    .doc table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .doc th, .doc td {
      border: 1px solid #c8c0af;
      padding: 0.45em 0.6em;
      vertical-align: top;
    }

    .doc th {
      background: #e9e0ce;
      color: #314f5e;
      font-weight: 700;
      text-align: left;
    }

    .doc img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0.7em auto;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .empty-state {
      color: #5e6772;
      text-align: center;
      margin-top: 2rem;
      font-style: italic;
    }

    @media (max-width: 1080px) {
      .app { grid-template-columns: 1fr; padding-bottom: 92px; }
      .panel { max-height: 54vh; }
      .preview-shell { padding: 0 0 8px; }
      .page { width: 100%; }
      .paper {
        width: 100%;
        min-height: auto;
      }
      .sticky-export {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 10;
      }
    }

    @page {
      size: A4;
      margin: 14mm;
    }

    @media print {
      html, body {
        background: var(--doc-bg) !important;
        color: var(--doc-text);
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .app {
        display: block;
        padding: 0;
      }

      .panel,
      .preview-shell > :not(.page) {
        display: none !important;
      }

      .preview-shell {
        overflow: visible;
        padding: 0;
      }

      .page {
        width: auto;
        padding: 0;
      }

      .paper {
        box-shadow: none;
        border: 0;
        border-radius: 0;
        width: auto;
        min-height: auto;
        margin: 0;
        padding: 0;
        background: transparent;
      }

      .doc {
        max-width: none;
        font-size: var(--doc-font-size);
      }

      .doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6,
      .doc pre,
      .doc table,
      .doc blockquote,
      .title-block {
        page-break-inside: avoid;
        break-inside: avoid;
      }

      a {
        color: inherit;
        text-decoration: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel">
      <div class="panel-header">
        <div class="brand">
          <h1>Text2PDF</h1>
          <p>Premium markdown-to-PDF typesetting</p>
        </div>
        <div class="live-indicator" id="stats">0 characters</div>
      </div>

      <div class="controls">
        <section class="group">
          <h2 class="group-title">Document Settings</h2>
          <div class="field">
            <label for="titleInput">Document title (optional)</label>
            <input id="titleInput" type="text" placeholder="Lecture Notes — Cell Biology" />
          </div>
          <div class="field">
            <label for="tagInput">Subject tag (optional)</label>
            <input id="tagInput" type="text" placeholder="Biochemistry" />
          </div>
          <div class="field">
            <label for="filenameInput">PDF filename (optional)</label>
            <input id="filenameInput" type="text" placeholder="cell-biology-notes" />
          </div>
        </section>

        <section class="group">
          <h2 class="group-title">Layout</h2>
          <div class="field">
            <label for="pageSize">Page size</label>
            <select id="pageSize">
              <option value="A4">A4</option>
              <option value="A5">A5</option>
            </select>
          </div>
          <div class="field">
            <label for="fontSize">Font size</label>
            <select id="fontSize">
              <option value="14">Small (14px)</option>
              <option value="16" selected>Medium (16px)</option>
              <option value="18">Large (18px)</option>
              <option value="20">XL (20px)</option>
            </select>
          </div>
        </section>

        <section class="group">
          <h2 class="group-title">Markdown Input</h2>
          <div class="field">
            <label for="inputText">Paste plain text or markdown</label>
            <textarea id="inputText" spellcheck="false"></textarea>
          </div>
        </section>

        <button id="exportBtn" class="export-btn sticky-export" type="button">Export PDF</button>
      </div>
    </aside>

    <main class="preview-shell" aria-live="polite">
      <div class="page">
        <article class="paper" id="paper">
          <header class="title-block" id="titleBlock" hidden>
            <h1 id="docTitle"></h1>
            <div class="subject-tag" id="docTag"></div>
            <hr class="title-rule" />
          </header>
          <section id="docContent" class="doc"></section>
        </article>
      </div>
    </main>
  </div>

  <style id="pageStyle"></style>

  <script>
    (function () {
      const input = document.getElementById('inputText');
      const titleInput = document.getElementById('titleInput');
      const tagInput = document.getElementById('tagInput');
      const filenameInput = document.getElementById('filenameInput');
      const pageSize = document.getElementById('pageSize');
      const fontSize = document.getElementById('fontSize');
      const exportBtn = document.getElementById('exportBtn');
      const stats = document.getElementById('stats');
      const pageStyle = document.getElementById('pageStyle');
      const docContent = document.getElementById('docContent');
      const titleBlock = document.getElementById('titleBlock');
      const docTitle = document.getElementById('docTitle');
      const docTag = document.getElementById('docTag');
      const root = document.documentElement;

      const defaultSample = `# Digestive Enzyme Revision Notes\n\nLearning the major digestive enzymes is easier when grouped by **location**, **substrate**, and **final products**.\n\n## Stomach\n\n- **Pepsin** begins protein digestion in acidic pH\n- Works best around pH 1.5 to 2\n- Secreted as inactive *pepsinogen*\n\n## Small Intestine\n\n| Enzyme | Source | Substrate | Product |\n|:--|:--|:--|:--|\n| Trypsin | Pancreas | Proteins | Peptides |\n| Amylase | Pancreas | Starch | Maltose |\n| Lipase | Pancreas | Triglycerides | Fatty acids + glycerol |\n\n> Tip: Memorize pancreatic enzymes together; they are co-released into the duodenum.\n\n### Quick recall code\n\n\`\`\`text\nP: proteins -> peptides\nA: starch -> sugars\nL: fats -> fatty acids\n\`\`\`\n\n---\n\nUse active recall after each section.`;

      if (!input.value.trim()) input.value = defaultSample;

      function escapeHtml(text) {
        return text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function tokenizeLines(text) {
        return text.replace(/\r\n?/g, '\n').split('\n');
      }

      function parseMarkdown(text) {
        const lines = tokenizeLines(text);
        let i = 0;

        function parseBlocks(endCond) {
          let html = '';
          while (i < lines.length) {
            if (endCond && endCond(lines[i])) break;
            const line = lines[i];

            if (!line.trim()) { i++; continue; }

            const fenceMatch = line.match(/^\s*(```+|~~~+)\s*([\w-]*)\s*$/);
            if (fenceMatch) {
              i++;
              const fence = fenceMatch[1];
              const lang = fenceMatch[2] || '';
              const codeLines = [];
              while (i < lines.length && !new RegExp('^\\s*' + fence + '\\s*$').test(lines[i])) {
                codeLines.push(lines[i]);
                i++;
              }
              if (i < lines.length) i++;
              html += `<pre><code class="lang-${escapeHtml(lang)}">${escapeHtml(codeLines.join('\n'))}</code></pre>`;
              continue;
            }

            const heading = line.match(/^(#{1,6})\s+(.*)$/);
            if (heading) {
              i++;
              const level = heading[1].length;
              html += `<h${level}>${parseInline(heading[2].trim())}</h${level}>`;
              continue;
            }

            if (/^\s*(([-*_])\s*){3,}$/.test(line)) {
              i++;
              html += '<hr />';
              continue;
            }

            if (/^\s*>/.test(line)) {
              const quoteLines = [];
              while (i < lines.length && /^\s*>/.test(lines[i])) {
                quoteLines.push(lines[i].replace(/^\s*>\s?/, ''));
                i++;
              }
              html += `<blockquote>${parseMarkdown(quoteLines.join('\n'))}</blockquote>`;
              continue;
            }

            const table = parseTable(lines, i);
            if (table) {
              html += table.html;
              i = table.next;
              continue;
            }

            const list = parseList(lines, i, 0);
            if (list) {
              html += list.html;
              i = list.next;
              continue;
            }

            const para = [];
            while (i < lines.length && lines[i].trim() &&
              !/^(#{1,6})\s+/.test(lines[i]) &&
              !/^\s*(```+|~~~+)/.test(lines[i]) &&
              !/^\s*>/.test(lines[i]) &&
              !/^\s*(([-*_])\s*){3,}$/.test(lines[i]) &&
              !isListLine(lines[i]) &&
              !isTableStart(lines, i)
            ) {
              para.push(lines[i]);
              i++;
            }
            html += `<p>${parseInline(para.join(' ').trim())}</p>`;
          }
          return html;
        }

        return parseBlocks();
      }

      function isListLine(line) {
        return /^\s*(?:[-+*]|\d+[.)])\s+/.test(line);
      }

      function getIndent(line) {
        const m = line.match(/^\s*/);
        return m ? m[0].replace(/\t/g, '    ').length : 0;
      }

      function parseList(lines, start, baseIndent) {
        if (!isListLine(lines[start])) return null;
        const firstMatch = lines[start].match(/^\s*(?:([-+*])|(\d+[.)]))\s+/);
        const ordered = Boolean(firstMatch && firstMatch[2]);
        const tag = ordered ? 'ol' : 'ul';
        let i = start;
        let html = `<${tag}>`;

        while (i < lines.length) {
          const line = lines[i];
          if (!line.trim()) { i++; continue; }
          const indent = getIndent(line);
          const match = line.match(/^\s*(?:([-+*])|(\d+[.)]))\s+(.*)$/);
          if (!match || indent < baseIndent) break;
          if (indent > baseIndent) {
            const nested = parseList(lines, i, indent);
            if (nested) {
              html = html.replace(/<\/li>$/, nested.html + '</li>');
              i = nested.next;
              continue;
            }
            break;
          }

          i++;
          const itemLines = [match[3]];
          while (i < lines.length) {
            const next = lines[i];
            if (!next.trim()) {
              if (lines[i + 1] && getIndent(lines[i + 1]) > indent) {
                itemLines.push('');
                i++;
                continue;
              }
              break;
            }
            if (isListLine(next) && getIndent(next) === indent) break;
            if (getIndent(next) < indent) break;
            itemLines.push(next.slice(Math.min(next.length, indent + 2)));
            i++;
          }

          let itemHtml;
          if (itemLines.length === 1 && !itemLines[0].includes('\n')) {
            itemHtml = parseInline(itemLines[0].trim().replace(/^\[( |x|X)\]\s+/, (_, s) => s.toLowerCase() === 'x' ? '☑ ' : '☐ '));
          } else {
            itemHtml = parseMarkdown(itemLines.join('\n'));
          }
          html += `<li>${itemHtml}</li>`;
        }

        html += `</${tag}>`;
        return { html, next: i };
      }

      function splitTableRow(row) {
        let trimmed = row.trim();
        if (trimmed.startsWith('|')) trimmed = trimmed.slice(1);
        if (trimmed.endsWith('|')) trimmed = trimmed.slice(0, -1);

        const cells = [];
        let buf = '';
        let escaped = false;
        for (const ch of trimmed) {
          if (escaped) { buf += ch; escaped = false; continue; }
          if (ch === '\\') { escaped = true; continue; }
          if (ch === '|') { cells.push(buf.trim()); buf = ''; continue; }
          buf += ch;
        }
        cells.push(buf.trim());
        return cells;
      }

      function isAlignmentRow(line) {
        const cells = splitTableRow(line);
        return cells.length > 0 && cells.every(c => /^:?-{3,}:?$/.test(c));
      }

      function isTableStart(lines, i) {
        return Boolean(lines[i] && lines[i + 1] && lines[i].includes('|') && isAlignmentRow(lines[i + 1]));
      }

      function parseTable(lines, start) {
        if (!isTableStart(lines, start)) return null;
        const headers = splitTableRow(lines[start]);
        const aligns = splitTableRow(lines[start + 1]).map(cell => {
          if (cell.startsWith(':') && cell.endsWith(':')) return 'center';
          if (cell.endsWith(':')) return 'right';
          if (cell.startsWith(':')) return 'left';
          return 'left';
        });
        let i = start + 2;
        const body = [];
        while (i < lines.length && lines[i].trim() && lines[i].includes('|')) {
          body.push(splitTableRow(lines[i]));
          i++;
        }
        let html = '<table><thead><tr>';
        headers.forEach((h, idx) => {
          html += `<th style="text-align:${aligns[idx] || 'left'}">${parseInline(h)}</th>`;
        });
        html += '</tr></thead><tbody>';
        body.forEach(row => {
          html += '<tr>';
          for (let c = 0; c < headers.length; c++) {
            html += `<td style="text-align:${aligns[c] || 'left'}">${parseInline(row[c] || '')}</td>`;
          }
          html += '</tr>';
        });
        html += '</tbody></table>';
        return { html, next: i };
      }

      function parseInline(text) {
        if (!text) return '';
        const placeholders = [];
        const stash = (content) => {
          const key = `\u0000${placeholders.length}\u0000`;
          placeholders.push(content);
          return key;
        };

        let s = escapeHtml(text);

        s = s.replace(/`([^`]+)`/g, (_, code) => stash(`<code>${code}</code>`));
        s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]+)")?\)/g, (_, alt, src, title) => {
          const titleAttr = title ? ` title="${escapeHtml(title)}"` : '';
          return stash(`<img src="${escapeHtml(src)}" alt="${escapeHtml(alt)}"${titleAttr} />`);
        });
        s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]+)")?\)/g, (_, label, href, title) => {
          const titleAttr = title ? ` title="${escapeHtml(title)}"` : '';
          return stash(`<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer"${titleAttr}>${label}</a>`);
        });

        s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
        s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        s = s.replace(/_([^_]+)_/g, '<em>$1</em>');
        s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
        s = s.replace(/\n/g, '<br />');

        s = s.replace(/\u0000(\d+)\u0000/g, (_, idx) => placeholders[Number(idx)]);
        return s;
      }

      function updatePageStyles() {
        const isA5 = pageSize.value === 'A5';
        const size = isA5
          ? { w: '148mm', h: '210mm', padding: '16mm', printMargin: '11mm' }
          : { w: '210mm', h: '297mm', padding: '20mm', printMargin: '14mm' };
        root.style.setProperty('--page-width', size.w);
        root.style.setProperty('--page-height', size.h);
        root.style.setProperty('--page-padding', size.padding);
        root.style.setProperty('--doc-font-size', `${fontSize.value}px`);

        pageStyle.textContent = `@page { size: ${pageSize.value}; margin: ${size.printMargin}; }`;
      }

      let frame = null;
      function render() {
        if (frame) cancelAnimationFrame(frame);
        frame = requestAnimationFrame(() => {
          const raw = input.value;
          stats.textContent = `${raw.length.toLocaleString()} characters`;
          const title = titleInput.value.trim();
          const tag = tagInput.value.trim();
          const hasTitleBlock = Boolean(title || tag);

          titleBlock.hidden = !hasTitleBlock;
          docTitle.textContent = title || 'Untitled Document';
          docTag.textContent = tag;

          const html = parseMarkdown(raw);
          docContent.innerHTML = html || '<p class="empty-state">Paste markdown on the left to generate your formatted document preview.</p>';
          updatePageStyles();
        });
      }

      function exportPdf() {
        const fileName = (filenameInput.value.trim() || titleInput.value.trim() || 'text2pdf-document')
          .replace(/[\\/:*?"<>|]+/g, '-')
          .replace(/\s+/g, ' ')
          .trim();
        const previous = document.title;
        document.title = fileName;

        window.print();

        setTimeout(() => {
          document.title = previous;
        }, 250);
      }

      [input, titleInput, tagInput, filenameInput, pageSize, fontSize].forEach(el => {
        el.addEventListener('input', render);
        el.addEventListener('change', render);
      });
      exportBtn.addEventListener('click', exportPdf);

      render();
    })();
  </script>
</body>
</html>
